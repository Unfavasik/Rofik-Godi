<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="w3Bg" x1="300" y1="0" x2="300" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2FBF6"/>
      <stop offset="48%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="w3Glow" cx="50%" cy="35%" r="44%">
