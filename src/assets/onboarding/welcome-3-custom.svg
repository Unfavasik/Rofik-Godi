  <g filter="url(#w3Shadow)">
    <path d="M300 144 C348 144 378 180 381 240 C384 298 370 344 375 404 C380 468 366 522 328 536 C312 542 288 542 272 536 C234 522 220 468 225 404 C230 344 216 298 219 240 C222 180 252 144 300 144 Z" fill="url(#w3Seat)" stroke="#39414E" stroke-width="2.5"/>
    <path d="M300 176 C332 176 348 206 349 256 C350 304 340 348 340 398 C340 444 350 482 326 502 C312 512 288 512 274 502 C250 482 260 444 260 398 C260 348 250 304 251 256 C252 206 268 176 300 176 Z" fill="#D9232D"/>
