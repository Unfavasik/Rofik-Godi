<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="w2Bg" x1="300" y1="0" x2="300" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5F6"/>
      <stop offset="56%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="w2Glow" cx="50%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#E11D2E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="w2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <pattern id="w2Quilt" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M9 0 L18 9 L9 18 L0 9 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#w2Bg)"/>
  <circle cx="300" cy="260" r="240" fill="url(#w2Glow)"/>

  <!-- Clean Rider Profile Setup Card -->
  <g filter="url(#w2Shadow)">
    <rect x="118" y="138" width="364" height="390" rx="38" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="2"/>
    <!-- Dark Vignette Card Header Band -->
    <path d="M118 176 C118 155 135 138 156 138 H444 C465 138 482 155 482 176 V242 H118 V176 Z" fill="#141010"/>
    <!-- Rider Avatar Medallion -->
    <circle cx="300" cy="242" r="52" fill="#FFFFFF"/>
    <circle cx="300" cy="242" r="44" fill="#FFF1F2" stroke="#E11D2E" stroke-width="3"/>
    <circle cx="300" cy="230" r="15" fill="#E11D2E"/>
    <path d="M274 268 C278 254 288 249 300 249 C312 249 322 254 326 268" fill="#0F172A"/>

    <!-- Minimal Input Field Skeletons -->
    <rect x="156" y="320" width="288" height="44" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="174" y="337" width="132" height="10" rx="5" fill="#CBD5E1"/>

    <rect x="156" y="380" width="288" height="44" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="174" y="397" width="168" height="10" rx="5" fill="#CBD5E1"/>

    <!-- Crimson Save/Continue Pill Accent -->
    <rect x="156" y="444" width="288" height="48" rx="24" fill="#E11D2E"/>
    <rect x="242" y="463" width="116" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.92"/>
  </g>

  <!-- Floating Mini Seat Swatch Card Left -->
  <g transform="translate(64, 246) rotate(-8)" filter="url(#w2Shadow)">
    <rect width="88" height="110" rx="24" fill="#17191E" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="12" y="12" width="64" height="86" rx="16" fill="#E11D2E"/>
    <rect x="12" y="12" width="64" height="86" rx="16" fill="url(#w2Quilt)"/>
  </g>

  <!-- Floating Offer Tag Badge Right -->
  <g transform="translate(454, 184) rotate(8)" filter="url(#w2Shadow)">
    <rect width="82" height="82" rx="24" fill="#E11D2E" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M27 41 H55 M41 27 V55" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>
